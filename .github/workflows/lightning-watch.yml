name: Lightning watch (PAGASA)

# Keeps a near-continuous watch on PAGASA's live lightning feed -- via
# panahon.gov.ph, PAGASA's own richer real-time delivery mechanism for the
# same underlying lightning network (see radar_to_tiff.py's module
# docstring for pagasa vs. panahon) -- and commits a new CSV segment (one
# per 60-minute split) into data/lightning/, with no human intervention and
# no dependency on any machine being turned on.
#
# NOTE: panahon is noticeably more fragile to run unattended than the
# simpler --lightning-source pagasa (a plain REST poll): panahon needs a
# real headless browser (Playwright, installed below) just to fetch a
# short-lived connection ticket before every websocket connect/reconnect,
# and depends on a mechanism PAGASA has already changed once before (see
# _fetch_panahon_ws_ticket()'s docstring in radar_to_tiff.py for the full
# story). If a run's watcher process dies from a failed connection,
# scripts/watch_and_commit.py now fails that job loudly (a red X in the
# Actions tab, not a misleading green check) so a broken run doesn't go
# unnoticed -- watch for that if panahon.gov.ph ever changes its ticket
# contract again.
#
# GitHub Actions caps a single job at 6 hours, so this can't literally run
# forever in one job. Instead each run watches for up to 178 minutes
# (2h58m) via scripts/watch_and_commit.py, checkpoints (commits+pushes)
# every 10 minutes along the way, then stops cleanly. The schedule below
# starts a fresh run every 3 hours, so the next one picks up shortly after
# the previous one stops -- in practice a small (~2 min) gap around each
# handoff, not a hard cutoff of coverage. (This used to be a ~10min gap at
# 170 minutes watched -- narrowed to 2min once the checkpoint/rebase logic
# got more resilient. Job timeout-minutes below still keeps a full 5-minute
# cleanup buffer *after* that 178min mark, same margin as before -- it just
# now spills a little past the next scheduled restart in the rare worst
# case, which only delays that next run's start slightly rather than
# losing anything.)
#
# The restart times themselves (00:00/03:00/06:00/09:00/12:00/15:00/18:00/
# 21:00 UTC below) are chosen to land exactly on 8AM/11AM/2PM/5PM/8PM/11PM/
# 2AM/5AM Philippines time (UTC+8) -- i.e. 2/5/8/11 AM and PM, every 3 hours
# on the dot. Every *other* clock hour of the day sits safely in the middle
# of a run and gets one clean, unsplit CSV file; only the hour a restart
# actually falls in (e.g. 1-2AM, 4-5AM, 7-8AM, 10-11AM, ...) ends up split
# across two files with a short gap between them -- with restarts every 3h
# instead of 6h,
# twice as many hours/day become one of these split hours (8 instead of 4),
# in exchange for smaller, more frequent checkpoints. Change the cron below
# (and re-derive the "which hour becomes the split hour" tradeoff, and
# max-minutes/timeout-minutes below to leave a ~10min buffer before the
# next slot) if a different cadence matters more to you.
#
# IMPORTANT: this only stays free if this repository is PUBLIC. GitHub
# Actions minutes are unlimited/free on GitHub-hosted runners for public
# repos; private repos only get 2,000 free minutes/month on the Free plan,
# and this workflow uses roughly 23 hours/day (~700 hours/month) -- see
# README.md for the full explanation.

on:
  # GitHub's own `schedule:` trigger turned out to be unreliable in practice
  # (it silently missed multiple 3-hourly slots in a row on 2026-09-09,
  # despite being configured correctly -- a known but undocumented-severity
  # flakiness in GitHub's own cron scheduler, not something in this repo).
  # Scheduling now lives OUTSIDE GitHub entirely: an external free service
  # (cron-job.org) calls this workflow's `workflow_dispatch` REST endpoint
  # every 3 hours instead, which is a normal, reliably-delivered API call
  # rather than GitHub's best-effort internal cron. See README.md's
  # "External scheduler (cron-job.org)" section for the exact setup.
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Max minutes to run (leave as 178 for a real run; use something small like 5 to smoke-test)'
        required: false
        default: '178'

# Never run two of these at once -- if a manual test run overlaps a
# scheduled one, let the one already running finish rather than racing
# both against the same branch.
concurrency:
  group: lightning-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 5 minutes above the script's own --max-minutes -- headroom for the
    # final checkpoint's commit+push. This now runs a little past the
    # 180-minute (3h) gap between scheduled restarts; see the note near the
    # top of this file for why that's fine.
    timeout-minutes: 183
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --lightning-source panahon needs a real headless browser to fetch its
      # connection ticket (see radar_to_tiff.py's _require_playwright()
      # docstring for why) -- this downloads that browser onto the runner.
      # Remove this step if you switch --lightning-source back to pagasa
      # below, which doesn't need it.
      # Retried up to 3 times: this step runs `apt-get update`/`install`
      # under the hood (for --with-deps), which occasionally fails with a
      # transient "Hash Sum mismatch" against Google's own Chrome apt repo
      # (dl.google.com serving a momentarily out-of-sync package index) --
      # nothing wrong on our end, it just needs a moment and another try.
      - name: Install Playwright's Chromium (needed by --lightning-source panahon)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."
            if playwright install --with-deps chromium; then
              echo "Succeeded."
              exit 0
            fi
            echo "Attempt $attempt failed -- retrying in 20s..."
            sleep 20
          done
          echo "::error::Failed to install Playwright's Chromium after 3 attempts."
          exit 1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --insecure is required here: ws.panahon.gov.ph fails Python's TLS
      # verification with "unable to get local issuer certificate" (a
      # missing-intermediate-certificate server misconfiguration -- a real
      # browser tolerates it, Python's ssl module doesn't). See the
      # build_client() comments in radar_to_tiff.py for the full story.
      - name: Watch panahon.gov.ph lightning feed (checkpointing every 10 min)
        run: |
          python scripts/watch_and_commit.py \
            --outdir data/lightning \
            --branch "${{ github.ref_name }}" \
            --max-minutes "${{ github.event.inputs.max_minutes || '178' }}" \
            --commit-every-minutes 10 \
            --split 60 \
            --interval 60 \
            --lightning-source panahon \
            --insecure
